[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pykb"
version = "0.1.0"
description = "本地文档语义检索（memsearch 的跨平台替代）：hybrid 检索 + HTTP 服务，Windows/macOS/Linux 全平台"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wanghaibin" }]
keywords = ["semantic-search", "embeddings", "memsearch", "rag", "local-first", "chinese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/hzerther-hub/pykb"

[project.scripts]
pykb = "kb_service:main"

[tool.setuptools]
py-modules = ["kb_service"]
