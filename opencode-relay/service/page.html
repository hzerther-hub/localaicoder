<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>opencode</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 侧栏：项目 / 会话 / 新建（桌面常驻，手机抽屉） -->
  <aside id="side">
    <div class="side-head">
      <div class="brand"><span class="dot"></span>opencode<span class="ver" id="ver"></span></div>
      <div class="projw"><select id="proj"></select></div>
      <button id="sessNew" type="button">＋ 新会话</button>
    </div>
    <div class="side-grp">会话</div>
    <div id="sessList"></div>
    <div class="side-foot">
      <div class="foot-row"><span>模型</span><select id="model"></select></div>
      <div class="foot-row"><span>权限</span><select id="modeSel">
        <option value="always">总是允许</option>
        <option value="ask">询问</option>
        <option value="readonly">只读</option>
      </select></div>
    </div>
  </aside>
  <div id="sideMask"></div>

  <!-- 主区 -->
  <div id="main">
    <header>
      <button id="btnS" aria-label="会话列表">☰</button>
      <div id="sessName"></div>
      <span id="run"></span>
      <button id="btnStop" type="button" title="停止">■</button>
      <span id="conn"></span>
    </header>

    <!-- 运行中会话横幅 -->
    <div id="runsBar"></div>

    <!-- 消息流（官方风格：角色标签 + 内联工具卡片） -->
    <div id="log"><div class="empty">选择左侧会话开始，或点「＋ 新会话」</div></div>

    <!-- 任务清单（todo） -->
    <div id="steps" class="stepsbar"></div>

    <!-- 权限审批条（ask 模式） -->
    <div id="permBar">
      <span class="perm-txt" id="permTxt">权限请求</span>
      <span class="perm-btns">
        <button type="button" data-p="deny">拒绝</button>
        <button type="button" data-p="allow">允许一次</button>
        <button type="button" data-p="always">总是允许</button>
      </span>
    </div>

    <!-- opencode 提问（Question 工具）作答条 -->
    <div id="qBar">
      <div class="perm-txt" id="qTxt">opencode 提问</div>
      <div id="qOpts"></div>
    </div>

    <!-- 待发送附件 -->
    <div id="pendingAtts"></div>

    <!-- 输入区 -->
    <form id="f">
      <button type="button" id="btnAtt" title="附件（图片/文件）">📎</button>
      <input id="i" placeholder="让 opencode 干活…（/ 唤起命令）" autocomplete="off">
      <button type="submit">↑</button>
    </form>
    <input type="file" id="fileAny" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
  </div>

  <!-- 斜杠命令菜单 -->
  <div id="slash"></div>

  <!-- 图片放大查看 -->
  <div id="lightbox"><img alt=""></div>

  <script src="js/main.js"></script>
</body>
</html>
