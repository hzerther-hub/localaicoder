<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Local AI Studio · 中继</title>
<style>
/* ---------- design tokens · agent telemetry / cockpit ---------- */
:root{
  --bg:#0a0e15;            /* ink base, blue-graphite */
  --bg-1:#0e131c;          /* panels */
  --bg-2:#141a26;          /* cards / inputs */
  --bg-3:#1a2231;          /* hover */
  --border:#1f2838;
  --border-2:#2a3448;
  --text:#e7ebf5;
  --text-dim:#9aa4ba;
  --text-faint:#5f6b85;
  --signal:#37d5c3;        /* live teal · running / active / links */
  --violet:#8b6ff0;        /* AI / brand accent */
  --ok:#4ade80;            /* done / success */
  --warn:#ffb648;          /* cooldown / caution */
  --danger:#ff6b80;        /* error / denied */
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 520px at 50% -12%,rgba(55,213,195,.07),transparent 60%),var(--bg);color:var(--text);font:15px/1.55 var(--sans);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#232c3f;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2e3a52}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:9px;padding:9px 12px;background:rgba(13,17,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6}
#btnS{flex:none;width:36px;height:36px;border:1px solid var(--border-2);border-radius:11px;background:var(--bg-2);color:#c6cde0;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
#btnS:hover{background:var(--bg-3);border-color:#3a4460}
#btnS:active{background:#202a3d}
#brand{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:none}
#brand .word{font-size:14px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
#brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;color:var(--signal);text-transform:uppercase;margin-top:2px}
#proj{flex:1;min-width:0}
select{background:var(--bg-2);border:1px solid var(--border-2);border-radius:11px;color:var(--text);font-size:13.5px;padding:9px 10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 11px) 50%;background-size:4px 4px;background-repeat:no-repeat;transition:border-color .15s,background-color .15s}
select:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(55,213,195,.14)}
select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#run{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--signal);font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;display:grid;grid-auto-flow:column;align-items:center;gap:5px}
#run:empty{display:none}
/* live signal lamp — the signature */
#conn{flex:none;width:9px;height:9px;border-radius:50%;background:#2b3549;transition:background .2s,box-shadow .2s}
#conn.live{background:var(--signal);box-shadow:0 0 0 3px rgba(55,213,195,.15)}
#conn.working{background:var(--signal);animation:pulse 1.5s ease-in-out infinite}
#conn.dead{background:var(--danger);box-shadow:0 0 0 3px rgba(255,107,128,.15)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(55,213,195,.15)}50%{box-shadow:0 0 0 7px rgba(55,213,195,.02)}}

/* ---------- control strip (model / effort / permission) ---------- */
.hrow{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-1)}
.ctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ctl span{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;padding-left:3px}
.ctl select{width:100%;padding:7px 24px 7px 9px;font-size:12.5px;background-color:var(--bg-2);border-radius:9px}
.ctl:nth-child(2),.ctl:nth-child(3){flex:none;width:86px}

/* ---------- session name ribbon ---------- */
.sessname{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);padding:7px 14px;background:#10141e;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessname:empty{display:none}

/* ---------- log ---------- */
#log{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:11px}
#log .empty{color:var(--text-faint);text-align:center;margin:48px auto;font-size:13.5px;max-width:70%}
.user{align-self:flex-end;max-width:84%;background:linear-gradient(135deg,#7b5be8,#9a6ff0);color:#fff;padding:11px 15px;border-radius:18px 18px 5px 18px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 18px rgba(123,91,232,.22);font-size:15px}
.ai{align-self:flex-start;max-width:84%;background:var(--bg-2);color:var(--text);border:1px solid var(--border-2);border-left:2px solid rgba(55,213,195,.55);padding:11px 15px;border-radius:6px 18px 18px 18px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.tool{align-self:flex-start;font-family:var(--mono);font-size:12px;color:var(--text-dim);background:transparent;padding:2px 6px;letter-spacing:.01em}
.err{align-self:stretch;font-size:13px;color:var(--danger);background:rgba(255,107,128,.09);border:1px solid rgba(255,107,128,.24);padding:9px 13px;border-radius:13px}
.msg-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg-img{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid rgba(255,255,255,.16);display:block}
.att-chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:12px;padding:6px 10px;margin:0 6px 6px 0;font-size:12px;color:var(--text-dim)}
.att-chip img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid rgba(231,235,245,.7);background:#fff}

/* ---------- agent activity (steps) ---------- */
.stepsbar{display:none;background:linear-gradient(180deg,rgba(55,213,195,.06),transparent),var(--bg-1);border-bottom:1px solid var(--border);padding:10px 14px;max-height:172px;overflow-y:auto;box-sizing:border-box}
.stepsbar.show{display:block}
.stepsbar-head{font-family:var(--mono);font-size:12px;color:var(--signal);margin-bottom:7px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:7px}
.stepsbar-head::before{content:"◐";font-size:11px;opacity:.8}
.step{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{color:var(--text-faint)}
.step.run{color:var(--signal)}
.step.wait{color:var(--text-faint)}
.step.deny{color:var(--danger)}

/* ---------- telemetry (stats) · collapsible ---------- */
.statsbar-wrap{display:none;align-items:center;gap:4px;padding:5px 6px 5px 13px;background:#0c111a;border-bottom:1px solid var(--border)}
.statsbar-wrap.on{display:flex}
.statsbar{flex:1 1 auto;min-width:0;display:none;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);align-items:center;letter-spacing:.01em}
.statsbar.show{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.statsbar.show::-webkit-scrollbar{display:none}
.statsbar-wrap.expanded .statsbar.show{flex-wrap:wrap;overflow:visible}
.statsbar .st{margin-right:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.statsbar .st:not(:last-child)::after{content:"|";color:var(--border-2);margin-left:13px}
#statsToggle{flex:none;border:0;background:transparent;color:var(--text-faint);font-size:12px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px}
#statsToggle:active{color:var(--signal);background:var(--bg-3)}

/* ---------- quick actions ---------- */
#qc{display:flex;flex-wrap:wrap;gap:8px 9px;padding:11px 14px;border-top:1px solid var(--border);background:var(--bg-1)}
#qc span{color:var(--text-dim);font-family:var(--mono);font-size:13px;cursor:pointer;line-height:1.7;white-space:nowrap;letter-spacing:.01em;border:1px solid var(--border-2);border-radius:20px;padding:4px 12px;transition:color .15s,border-color .15s,background .15s}
#qc span:hover{color:var(--text);border-color:#3a4460;background:var(--bg-3)}
#qc span:active{color:var(--signal);border-color:var(--signal);background:rgba(55,213,195,.08)}

/* ---------- composer ---------- */
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--bg-1)}
form input{flex:1;background:var(--bg-2);border:1px solid var(--border-2);border-radius:13px;padding:12px 14px;color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
form input:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(55,213,195,.13)}
form input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
form button{background:linear-gradient(135deg,#6c5ce7,#8f6cf0);border:0;border-radius:13px;color:#fff;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(108,92,231,.24);transition:transform .1s,box-shadow .15s}
form button:active{transform:translateY(1px)}

/* ---------- sessions drawer ---------- */
#drawer{position:fixed;inset:0;background:rgba(2,4,8,.55);display:none;z-index:9}
#drawer.open{display:block}
#drawer .panel{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:360px;background:var(--bg-1);overflow-y:auto;padding:14px;box-shadow:2px 0 28px rgba(0,0,0,.5);border-right:1px solid var(--border)}
.gr{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);padding:12px 8px 7px;letter-spacing:.1em;text-transform:uppercase}
.s{padding:11px 12px;border-radius:12px;margin-bottom:5px;color:var(--text-dim);cursor:pointer;display:flex;gap:8px;align-items:center;background:var(--bg-2);border:1px solid transparent;transition:background .15s,border-color .15s}
.s:hover{background:var(--bg-3)}
.s:active{background:var(--bg-3)}
.s.on{background:linear-gradient(135deg,rgba(55,213,195,.13),rgba(55,213,195,.06));color:#e7fbff;border:1px solid rgba(55,213,195,.32)}
.s .run{color:var(--signal);flex:none}
.s .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.s .ago{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex:none;font-variant-numeric:tabular-nums}
.s .s-act{flex:none;font-size:12px;color:var(--text-faint);padding:2px 5px;border-radius:6px}
.s .s-act:active{background:var(--bg-3);color:var(--text)}
.s .s-act.del:active{color:var(--danger)}

/* ---------- slash menu ---------- */
#slash{display:none;position:fixed;left:12px;right:12px;bottom:64px;background:var(--bg-1);border:1px solid var(--border-2);border-radius:15px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:8}
#slash.open{display:block}
#slash .si{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
#slash .si:last-child{border-bottom:0}
#slash .si:active{background:var(--bg-3)}
#slash .si .k{flex:none;color:var(--signal);font-family:var(--mono);font-size:13.5px;font-weight:600}
#slash .si .d{flex:1;font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:380px){
  #brand .word{font-size:12.5px}
  #brand .sub{letter-spacing:.22em}
}
@media (prefers-reduced-motion:reduce){
  #conn.working{animation:none}
  *{transition-duration:.01ms!important}
}
</style></head><body>
<header>
 <button id="btnS" aria-label="会话列表">☰</button>
 <div id="brand"><span class="word">Local AI Studio</span><span class="sub">Relay Console</span></div>
 <select id="proj"></select>
 <span id="run"></span>
 <span id="conn"></span>
</header>
<div class="hrow">
 <div class="ctl"><span>模型</span><select id="model"></select></div>
 <div class="ctl"><span>推理</span><select id="effort"></select></div>
 <div class="ctl"><span>权限</span><select id="modeSel"><option value="always">总是允许</option><option value="ask">询问</option><option value="readonly">只读</option></select></div>
</div>
<div id="sessName" class="sessname"></div>
<div id="drawer"><div class="panel" id="sessList"></div></div>
<div id="log"><div class="empty">从左上选择一个会话开始</div></div>
<div id="slash"></div>
<div id="steps" class="stepsbar"></div>
<div id="statsBar" class="statsbar-wrap"><div id="stats" class="statsbar"></div><button id="statsToggle" type="button" aria-label="展开用量详情">▸</button></div>
<div id="qc"><span data-p="列出当前项目的目录结构">列目录</span><span data-p="分析这个项目，找出可能的 BUG 并给出修复">找 BUG</span><span data-p="为最近的代码改动补充单元测试">写测试</span><span data-p="分析当前代码，给出重构建议">重构建议</span></div>
<div id="pendingAtts"></div>
<form id="f"><input id="i" placeholder="发消息…" autocomplete="off"><button>发送</button></form>
<input type="file" id="fileAny" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<script>
const RELAY=true;
const D=new URLSearchParams(location.search).get('d');
const WS=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/s/ws?d='+D;
const $=id=>document.getElementById(id);
const log=$('log');
let ALL=[],wsCur='',sid='',runs=new Set(),cur=null,ws,rid=0,lastCurrent='',openSeq=0;
const pend={};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
const ago=ts=>{const d=Date.now()/1000-ts;if(d<60)return '刚刚';if(d<3600)return Math.floor(d/60)+'分';if(d<86400)return Math.floor(d/3600)+'时';return Math.floor(d/86400)+'天';};
function setConn(s){const el=$('conn');if(el)el.className=s;}
function setSessName(){const el=$('sessName');if(!el)return;const i=ALL.findIndex(x=>x.id===sid);const t=i>=0?ALL[i].title:'';el.textContent=t?('会话：'+t):'（选择一个会话）';}
function req(o){return new Promise(res=>{const id=++rid;pend[id]=res;ws.send(JSON.stringify(Object.assign(o,{rid:id})));});}
function addMsgImgs(container,imgs){if(!imgs||!imgs.forEach||!imgs.length)return;const w=document.createElement('div');w.className='msg-thumbs';imgs.forEach(u=>{const im=document.createElement('img');im.className='msg-img';im.src=u;w.appendChild(im);});container.appendChild(w);log.scrollTop=log.scrollHeight;}
function renderMsg(x){
  const d=add(x.role==='user'?'user':'ai', x.text||'');
  addMsgImgs(d,x.images);
  return d;
}
function add(cls,t){const d=document.createElement('div');d.className=cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function connect(){
 ws=new WebSocket(WS);
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.rid&&pend[m.rid]){pend[m.rid](m);delete pend[m.rid];return}
  if(m.sessionId&&sid&&m.sessionId!==sid)return;
  if(m.type==='user_message'){const d=add('user',m.text);addMsgImgs(d,m.images);cur=null;}
  else if(m.type==='text'){if(!cur)cur=add('ai','');cur.textContent+=m.delta;log.scrollTop=log.scrollHeight;}
  else if(m.type==='tool'){add('tool','🔧 '+m.delta);}
  else if(m.type==='error'){add('err',m.delta);cur=null;}
  else if(m.type==='run:started'){runs.add(m.sessionId);mark(m.sessionId,true);badge();if(m.sessionId===sid){steps=[];round=0;planned=false;renderSteps();}}
  else if(m.type==='run:finished'){runs.delete(m.sessionId);mark(m.sessionId,false);badge();cur=null;if(m.sessionId===sid){steps=[];renderSteps();}}
  else if(m.type==='usage'){usage=m.usage||{};total=m.total||{};renderStats();}
 else if(m.type==='round'){round=+m.n;renderSteps();}
 else if(m.type==='tool_start'){
  if(!runs.has(sid)){renderSteps();return;}
  if(m.name==='todo_write'){const ts=(m.args&&m.args.todos)||[];steps=ts.slice(0,20).map((t,i)=>({name:'todo',title:String((t&&t.title)||('步骤 '+(i+1))).slice(0,80),status:(t&&t.status)==='completed'?'done':(t&&t.status)==='in_progress'?'run':'wait'}));planned=true;}
  else if(!planned){steps=steps.filter(x=>x.name!=='…');steps.push({name:m.name,title:m.name,status:'run'});}
  renderSteps();
 }
 else if(m.type==='tool_result'){if(!runs.has(sid)){renderSteps();return;}if(m.name!=='todo_write'&&!planned){for(let i=steps.length-1;i>=0;i--){if(steps[i].name===m.name&&steps[i].status==='run'){steps[i].status='done';break;}}}renderSteps();}
 else if(m.type==='tool_denied'){if(!runs.has(sid)){renderSteps();return;}for(let i=steps.length-1;i>=0;i--){if(steps[i].name===m.name&&steps[i].status==='run'){steps[i].status='deny';break;}}renderSteps();}
 else if(m.type==='model:changed'){loadModels();}
  else if(m.type==='permission:changed'){try{$('modeSel').value=m.value}catch(e){}}
  else if(m.type==='sessions:changed'){loadState();}
  else if(m.type==='session:opened'){openS(m.id,false);}
 };
 ws.onopen=()=>{setConn('live');loadState();loadModels();};
 ws.onclose=(e)=>{let why='';const c=e&&e.code;if(c&&c!==1000)why=' (code '+c+')';setConn('dead');add('err','连接断开'+why+'，10 秒后重连…');setTimeout(()=>{log.innerHTML='';connect();},10000);};
}
function applyState(s){
 ALL=s.sessions||[];
 const map={};ALL.forEach(x=>{const k=x.workspace||'';(map[k]=map[k]||{n:0,u:0}).n++;map[k].u=Math.max(map[k].u,x.updated)});
 // 保证当前项目总是出现在下拉（即使还没会话，新建项目也能看到）
 const w0=s.workspace||'';if(w0&&!map[w0])map[w0]={n:0,u:0};
 const sel=$('proj');const keep=wsCur||s.workspace;
 sel.innerHTML=Object.keys(map).sort((a,b)=>map[b].u-map[a].u).map(w=>'<option value="'+esc(w)+'">'+esc(w.split('/').filter(Boolean).pop()||w)+' ('+map[w].n+')</option>').join('');
 wsCur=map[keep]?keep:(sel.options[0]?sel.options[0].value:'');sel.value=wsCur;
 window.__ws=s.workspace||'';window.__branch=s.branch||'';try{compact=(s.compact&&{budget:Number(s.compact.budget)||0,window:Number(s.compact.window)||0})||compact}catch(e){}
renderStats();
runs=new Set(ALL.filter(x=>x.running).map(x=>x.id));
  renderSteps(); // 状态刷新后重算步骤栏（含 runs 更新后，保证当前会话运行中能显示）
 try{$('modeSel').value=s.mode||'always'}catch(e){}
 const _cur=s.current||'';if(_cur&&_cur!==lastCurrent){lastCurrent=_cur;loadModels();}
 const _cs=s.current_session||'';if(_cs&&_cs!==sid){openS(_cs,false);}
 setSessName();renderSess();badge();
}
function loadState(){req({type:'state'}).then(applyState);}
let steps=[],round=0,planned=false;
let usage={},total={},compact={budget:0,window:0};
function fmtN(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}
function renderStats(){const el=$('stats');if(!el)return;const u=usage,t=total,c=compact;
 const turnHit=u.prompt_tokens>0?((u.cached_tokens||0)/u.prompt_tokens*100).toFixed(1)+'%':'—';
 const avgHit=t.prompt_tokens>0?((t.cached_tokens||0)/t.prompt_tokens*100).toFixed(2)+'%':'—';
 const ctx=c.window>0?Math.min(100,(u.prompt_tokens||0)/c.window*100).toFixed(0)+'%':'—';
 const comp=c.window>0?Math.min(100,(c.budget/c.window)*100).toFixed(0)+'%':'—';
 const ws=(window.__ws||'').split('/').filter(Boolean).slice(-2).join('/');
 // 关键指标排前：折叠成一行时先露「本次命中 / 会话 / 本次缓存 / 本次费用」
 const parts=['⌂ '+ws,'⎇ '+(window.__branch||'—'),'本次命中 '+turnHit,'会话 '+fmtN(t.total_tokens||0),'本次缓存 '+fmtN(u.cached_tokens||0),'平均命中 '+avgHit,'本次 tokens '+fmtN(u.total_tokens||0),'输出 '+fmtN(u.completion_tokens||0),'本次费用 '+((u.cost_usd&&u.cost_usd>0)?('¥'+(u.cost_usd*7.2).toFixed(4)):'—'),'上下文 '+ctx,'压缩阈值 '+comp];
 el.innerHTML=parts.map(function(x){return '<span class="st">'+esc(x)+'</span>'}).join('');el.classList.add('show');const _w=el.parentElement;if(_w&&_w.classList)_w.classList.add('on');}
function renderSteps(){const el=$('steps');if(!el)return;if(!steps.length||!runs.has(sid)){el.classList.remove('show');return;}el.classList.add('show');
 const done=steps.filter(x=>x.status==='done').length;
 const head=done+'/'+steps.length+' · 运行中 · 第 '+round+' 轮';
 el.innerHTML='<div class="stepsbar-head">任务步骤 '+esc(head)+'</div>'+steps.map(x=>'<div class="step '+x.status+'">'+(x.status==='done'?'✅':x.status==='run'?'●':x.status==='deny'?'✗':'○')+' '+esc(x.title)+'</div>').join('');
 el.scrollTop=el.scrollHeight;}
function renderSess(){
 const rows=ALL.filter(x=>(x.workspace||'')===wsCur).sort((a,b)=>b.updated-a.updated);
 let h='<div class="gr">项目会话（'+rows.length+'）</div>';
 rows.forEach(x=>{h+='<div class="s'+(x.id===sid?' on':'')+'" data-id="'+x.id+'">'
  +(x.running?'<span class="run">▶</span>':'')+'<span class="t">'+esc(x.title)+'</span>'
  +'<span class="s-act" data-act="rename">✎</span><span class="s-act del" data-act="del">🗑</span>'
  +'<span class="ago">'+ago(x.updated)+'</span></div>';});
 $('sessList').innerHTML=h||'<div class="gr">该项目暂无会话</div>';
}
function badge(){const c=$('conn');if(c)c.classList.toggle('working',runs.size>0);$('run').textContent=runs.size?'▶ '+runs.size:'';}
function mark(id,on){ALL.forEach(x=>{if(x.id===id)x.running=on});renderSess();}
async function openS(id,notify){
 const seq=++openSeq;
 sid=id;$('drawer').classList.remove('open');log.innerHTML='';cur=null;renderSess();
 setSessName();
 if(notify){try{ws.send(JSON.stringify({type:'open_session',id}))}catch(e){}}
 const m=await req({type:'messages',id});
 if(seq!==openSeq)return; // 已有更新的 openS，丢弃本次渲染（防切换并发重复）
 if(m.messages&&m.messages.length)m.messages.forEach(renderMsg);
 else log.innerHTML='<div class="empty">（空会话，直接发第一条消息）</div>';
}
async function loadModels(){
 let d; try{ d=await req({type:'models'});}catch(e){d=null;}
  const sel=$('model');
 if(!d||!d.models||!d.models.length){ sel.innerHTML='<option value="">正在连接桌面…</option>'; fillEffort(null); return; }
 sel.innerHTML=d.models.map(x=>'<option value="'+esc(x.key)+'"'+(x.is_current?' selected':'')+'>'+esc(x.model_id||x.display_name)+(x.vision?' 👁':'')+(x.reasoning?' 🧠':'')+'</option>').join('');
 fillEffort(d.models.find(x=>x.is_current)||null);
}
function fillEffort(mi){
  const ef=$('effort');
 const choices=(mi&&mi.reasoning&&mi.reasoning_choices)?mi.reasoning_choices:[];
 ef.innerHTML=choices.length
   ? choices.map(c=>'<option value="'+esc(c)+'"'+((mi.reasoning_effort||'')===c?' selected':'')+'>'+esc(c===''?'默认':c)+'</option>').join('')
   : '<option value="">—</option>';
 if(mi&&mi.reasoning_effort)ef.value=mi.reasoning_effort;
}
$('model').onchange=async()=>{const k=$('model').value;try{await req({type:'model',key:k});}catch(e){}
 try{const d=await req({type:'models'});if(d)sel2models(d);}catch(e){}
 function sel2models(d){const s=$('model');s.innerHTML=d.models.map(x=>'<option value="'+esc(x.key)+'"'+(x.is_current?' selected':'')+'>'+esc(x.model_id||x.display_name)+'</option>').join('');fillEffort(d.models.find(x=>x.is_current)||null);}
};
$('effort').onchange=async()=>{const k=$('model').value,e=$('effort').value;try{await req({type:'effort',key:k,effort:e});}catch(e){}};
$('modeSel').onchange=async()=>{const v=$('modeSel').value;try{await req({type:'mode',value:v});}catch(e){}};
$('statsToggle').onclick=()=>{const w=$('stats').parentElement;if(!w)return;w.classList.toggle('expanded');$('statsToggle').textContent=w.classList.contains('expanded')?'▾':'▸';};
$('sessList').onclick=e=>{const act=e.target.closest('.s-act');
 if(act){const row=act.closest('.s');if(!row)return;const id=row.dataset.id;
  if(act.dataset.act==='del'){ if(confirm('删除该会话？')) req({type:'delete_session',id}).then(()=>loadState()); }
  else if(act.dataset.act==='rename'){ const nm=prompt('新标题',''); if(nm&&nm.trim()) req({type:'rename_session',id,title:nm.trim()}).then(()=>loadState()); }
  return; }
 const r=e.target.closest('.s');if(r)openS(r.dataset.id,true);};
$('btnS').onclick=()=>{$('drawer').classList.toggle('open');if($('drawer').classList.contains('open'))loadState();};
$('drawer').onclick=e=>{if(e.target.id==='drawer')$('drawer').classList.remove('open')};
$('proj').onchange=()=>{wsCur=$('proj').value;renderSess();};
$('qc').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const i=$('i');i.value=(i.value?i.value+'\n':'')+b.dataset.p;i.focus();};
let pendingAtts=[];
function addAttChip(a){const box=$('pendingAtts');if(!box)return;const c=document.createElement('div');c.className='att-chip';
 if((a.data||'').startsWith('data:image')){const im=document.createElement('img');im.src=a.data;c.appendChild(im);}
 const sp=document.createElement('span');sp.textContent=a.name;c.appendChild(sp);box.appendChild(c);}
function readAsImage(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.8));};img.src=r.result;};r.readAsDataURL(file);}
function readAsData(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);}
$('fileAny').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const isImg=(f.type||'').startsWith('image/');const cb=d=>{pendingAtts.push({name:f.name,data:d});addAttChip({name:f.name,data:d});};if(isImg)readAsImage(f,cb);else readAsData(f,cb);e.target.value='';});
function addPasted(f){if(!f)return;const isImg=(f.type||'').startsWith('image/');const cb=d=>{pendingAtts.push({name:f.name||'pasted',data:d});addAttChip({name:f.name||'pasted',data:d});};if(isImg)readAsImage(f,cb);else readAsData(f,cb);}
// 粘贴（图片/文件）
$('i').addEventListener('paste',e=>{const items=(e.clipboardData&&e.clipboardData.items)||[];const it=[].slice.call(items).find(x=>x.type&&x.type.startsWith('image/'));if(it){e.preventDefault();addPasted(it.getAsFile());}});
// 拖放（图片/文件）→ 加入附件
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const fs=(e.dataTransfer&&e.dataTransfer.files)||[];[].slice.call(fs).forEach(addPasted);});
const CMDS=[['/file','选择文件/图片，传给PC识别'],['/列目录','列出当前项目的目录结构'],['/找bug','分析这个项目，找出可能的 BUG 并给出修复'],['/写测试','为最近的代码改动补充单元测试'],['/总结','总结最近的 git 提交和改动要点'],['/重构','分析当前代码，给出重构建议'],['/解释','解释当前项目的作用和整体结构']];
function slashShow(q){
 const box=$('slash');
 const list=CMDS.filter(c=>!q||c[0].slice(1).toLowerCase().includes(q.toLowerCase())).slice(0,8);
 if(!list.length){box.classList.remove('open');return;}
 box.innerHTML=list.map(c=>'<div class="si" data-k="'+esc(c[0])+'" data-t="'+esc(c[1])+'"><span class="k">'+c[0]+'</span><span class="d">'+esc(c[1])+'</span></div>').join('');
 box.classList.add('open');
}
$('i').addEventListener('input',()=>{const v=$('i').value;if(v.startsWith('/'))slashShow(v.slice(1));else $('slash').classList.remove('open');});
$('slash').addEventListener('click',e=>{const si=e.target.closest('.si');if(!si)return;const k=si.dataset.k;
 if(k==='/file'){const i=$('i');i.value='';try{$('fileAny').click()}catch(_){}
 }else{const i=$('i');i.value=si.dataset.t;i.focus();}
 $('slash').classList.remove('open');});
$('i').addEventListener('keydown',e=>{if(e.key==='Escape')$('slash').classList.remove('open');});
$('f').onsubmit=ev=>{ev.preventDefault();
 const i=$('i');const t=i.value.trim();
 // /file 不当聊天消息发：激活上传（拉选择器，清空输入框）
 if(t.startsWith('/file')){ i.value='';cur=null;try{$('fileAny').click()}catch(_){}; $('slash').classList.remove('open'); return; }
 if(!t&&!pendingAtts.length)return;
 if(!sid)return;
 i.value='';cur=null;
 ws.send(JSON.stringify({type:'send',session:sid,text:t,atts:pendingAtts}));
 pendingAtts=[];try{$('pendingAtts').innerHTML=''}catch(_){};
};
connect();setInterval(loadState,8000);
</script></body></html>
