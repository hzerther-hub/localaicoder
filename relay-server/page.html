<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Local AI Studio · 中继</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/highlight.github-dark.min.css">
</head>
<body>
  <header>
    <button id="btnS" aria-label="会话列表">☰</button>
    <select id="proj"></select>
    <button id="hdrFiles" type="button" title="文件列表：浏览 / 编辑 / 开发">📁 文件</button>
    <span id="run"></span>
    <span id="conn"></span>
  </header>

  <!-- 模型 / 推理 / 权限 控制条 -->
  <div class="hrow">
    <div class="ctl"><span>模型</span><select id="model"></select></div>
    <div class="ctl"><span>推理</span><select id="effort"></select></div>
    <div class="ctl">
      <span>权限</span>
      <select id="modeSel">
        <option value="always">总是允许</option>
        <option value="ask">询问</option>
        <option value="readonly">只读</option>
      </select>
    </div>
  </div>

  <!-- 正在运行的会话（跨项目，点击跳转） -->
  <div id="runsBar"></div>

  <!-- 当前会话名 -->
  <div id="sessName" class="sessname"></div>

  <!-- 会话抽屉（顶部：项目同步方向配置 + 工作目录浏览） -->
  <div id="drawer"><div class="panel">
    <div id="syncRow"><span>项目同步</span><select id="syncSel">
      <option value="pc2m">跟随 PC</option>
      <option value="m2pc">控制 PC</option>
    </select></div>
    <div id="dirBox">
      <div class="gr">工作目录</div>
      <div id="dirNow" class="dir-now">📂 …</div>
      <div id="dirList" class="dir-list"></div>
      <div class="dir-row"><input id="dirInput" placeholder="粘贴绝对路径回车进入" autocomplete="off" spellcheck="false"><button id="dirGo" type="button">进入</button></div>
      <button id="dirNew" type="button" class="dir-new">📁 在此目录新建会话</button>
      <button id="btnFiles" type="button" class="dir-new" style="display:none">📂 文件浏览 / 编辑（代码着色）</button>
    </div>
    <div id="sessList"></div>
  </div></div>

  <!-- 消息日志 -->
  <div id="log"><div class="empty">从左上选择一个会话开始</div></div>

  <!-- 编程过程（点击底部按钮切换：过程面板 ⇋ 聊天） -->
  <div id="codePanel">
    <div id="codeHead"><span class="t">⌨ 编程过程</span><span id="codeRound"></span><button id="codeClear" type="button">清空</button></div>
    <div id="codeLog"></div>
  </div>
  <div id="codeDock"><button id="codeBtn" type="button">⌨ 编程过程</button><span id="codeDot"></span></div>

  <!-- 斜杠命令菜单 -->
  <div id="slash"></div>

  <!-- 任务步骤栏 -->
  <div id="steps" class="stepsbar"></div>

  <!-- 用量状态栏 -->
  <div id="statsBar" class="statsbar-wrap">
    <div id="stats" class="statsbar"></div>
    <button id="statsToggle" type="button" aria-label="展开用量详情">▸</button>
  </div>

  <!-- 快捷操作 -->
  <div id="qc">
    <span data-p="列出当前项目的目录结构">列目录</span>
    <span data-p="分析这个项目，找出可能的 BUG 并给出修复">找 BUG</span>
    <span data-p="为最近的代码改动补充单元测试">写测试</span>
    <span data-p="分析当前代码，给出重构建议">重构建议</span>
  </div>

  <!-- 待发送附件 -->
  <div id="pendingAtts"></div>

  <!-- 权限审批条（ask 模式） -->
  <div id="permBar">
    <span class="perm-txt" id="permTxt">权限请求</span>
    <span class="perm-btns">
      <button type="button" data-p="deny">拒绝</button>
      <button type="button" data-p="allow">允许一次</button>
      <button type="button" data-p="always">总是允许</button>
    </span>
  </div>

  <!-- 输入区 -->
  <form id="f">
    <input id="i" placeholder="发消息…" autocomplete="off">
    <button>发送</button>
  </form>
  <input type="file" id="fileAny" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">

  <!-- 文件窗口最小化条（加入对话框后停在聊天页，点击返回编辑） -->
  <div id="fsMinBar">📄 <span id="fsMinName"></span><span style="color:#8a93a5">· 点击返回</span></div>
  <!-- 美化选择弹层的遮罩 -->
  <div id="ddMask"></div>

  <!-- WEB 文件浏览面板（电脑端开关 fs_enabled 后可用） -->
  <div id="fsPanel">
    <div class="fs-head">
      <span class="fs-title" id="fsPanelTitle">📁 文件</span>
      <button type="button" id="fsClose">✕</button>
    </div>
    <div class="fs-jump">
      <input id="fsPath" placeholder="输入路径，留空看当前项目（安全模式）或全部磁盘">
      <button type="button" id="fsGo">跳转</button>
    </div>
    <div class="fs-crumb" id="fsCrumb"></div>
    <div id="fsList"></div>
    <div class="fs-foot">
      <button type="button" id="fsProj">📂 设为项目（切工作区）</button>
      <span class="fs-hint" id="fsHint"></span>
    </div>
  </div>

  <!-- 文件查看 / 编辑器 -->
  <div id="fsView">
    <div class="fs-head">
      <span class="fs-title" id="fvName">file</span>
      <span class="fs-act">
        <button type="button" id="fvChat">💬 加入对话框</button>
        <button type="button" id="fvDesktop" title="在电脑端编辑器打开">🖥 电脑端打开</button>
        <button type="button" id="fvEdit">✎ 编辑</button>
        <button type="button" id="fvSave" style="display:none">💾 保存</button>
        <button type="button" id="fvMin" title="最小化，回到聊天">—</button>
        <button type="button" id="fvClose">✕</button>
      </span>
    </div>
    <div class="fs-meta" id="fvMeta"></div>
    <div id="fvBody">
      <pre id="fvPre"><code class="hljs"></code></pre>
      <div id="fvEditWrap">
        <pre id="fvHl" aria-hidden="true"><code class="hljs"></code></pre>
        <textarea id="fvTa" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <button type="button" id="fvSelChat" style="display:none">💬 加入对话框</button>
      </div>
    </div>
  </div>


  <!-- 文件操作菜单（编辑/改名/删除） -->
  <div id="fsMenu">
    <div class="fs-menu-box">
      <div class="fs-menu-name" id="fsmName"></div>
      <button type="button" data-act="chat">💬 加入对话框</button>
      <button type="button" data-act="edit" id="fsmEdit">✎ 编辑</button>
      <button type="button" data-act="rename">✏️ 改名</button>
      <button type="button" data-act="del" class="danger">🗑 删除</button>
      <button type="button" data-act="cancel">取消</button>
    </div>
  </div>


  <!-- 重命名会话（美化版，预填当前标题，校验重名） -->
  <div id="rnMask">
    <div class="rn-box">
      <div class="rn-title">✎ 重命名会话</div>
      <input id="rnInput" maxlength="60" autocomplete="off" spellcheck="false" placeholder="会话名称">
      <div class="rn-err" id="rnErr"></div>
      <div class="rn-btns">
        <button type="button" id="rnCancel">取消</button>
        <button type="button" id="rnOk">确定</button>
      </div>
    </div>
  </div>

  <script src="js/highlight.min.js"></script>
  <script src="js/hljs-powershell.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
